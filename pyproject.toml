[project]
name = "dorsal-ml"
version = "0.1.0"
description = "DORSAL ML training pipeline"
requires-python = ">=3.11"
dependencies = [
  "scikit-learn==1.5.2",
  "pandas==2.2.3",
  "numpy==1.26.4",
  "scipy==1.14.1",
  "skl2onnx==1.17.0",
  "onnxruntime==1.19.2",
  "onnx==1.16.2",
  "faker==30.8.2",
  "pyarrow==18.0.0",
  "lxml==5.3.0",
  "orjson==3.10.11",
  "tldextract==5.1.3",
  "chardet==5.2.0",
  "locust==2.31.5",
  "httpx==0.27.2",
  "requests==2.32.3",
  "schedule==1.2.2",
  "rich==13.9.4",
  "loguru==0.7.3",
  "cryptography==45.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.3",
  "pytest-cov==5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
